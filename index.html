<!doctype html>
<html lang="en" data-theme="good">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heroes of Might & Magic II — Music Player</title>
    <script>
      // Pre-paint theme hydration: set data-theme before first paint to avoid a flash.
      ;(function () {
        try {
          var t = localStorage.getItem('h2mp-theme')
          if (t === 'good' || t === 'evil') {
            document.documentElement.setAttribute('data-theme', t)
          }
        } catch (e) {
          /* localStorage unavailable — keep the default from the html attribute */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
