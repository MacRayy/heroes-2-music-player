<!doctype html>
<html lang="en" data-theme="good">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" media="(prefers-color-scheme: light)" />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="/favicon-dark.png" />
    <title>Heroes of Might & Magic II — Music Player</title>
    <meta
      name="description"
      content="A themed web player for the Heroes of Might & Magic II soundtrack — the game's own art, fonts, and icons, with switchable Good/Evil themes."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://homm2musicplayer.com/" />
    <meta property="og:title" content="Heroes of Might & Magic II — Music Player" />
    <meta
      property="og:description"
      content="A themed web player for the Heroes of Might & Magic II soundtrack, using the game's own art and fonts."
    />
    <meta property="og:image" content="https://homm2musicplayer.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Heroes of Might & Magic II Music Player" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Heroes of Might & Magic II — Music Player" />
    <meta
      name="twitter:description"
      content="A themed web player for the Heroes of Might & Magic II soundtrack, using the game's own art and fonts."
    />
    <meta name="twitter:image" content="https://homm2musicplayer.com/og.png" />
    <script>
      // Pre-paint theme hydration: set data-theme before first paint to avoid a flash.
      ;(function () {
        try {
          var t = localStorage.getItem('h2mp-theme')
          if (t === 'good' || t === 'evil') {
            document.documentElement.setAttribute('data-theme', t)
          }
        } catch (e) {
          /* localStorage unavailable — keep the default from the html attribute */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
