name: CI

on:
  push:
    branches: [master]
  pull_request:

# E2E (`yarn e2e`) is intentionally NOT run here: it drives the real app, which needs the
# gitignored game assets to render, so a stock runner can't execute it. It stays a local /
# pre-push check — see wiki/workflows/testing.md.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.script }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: [lint, 'format:check', typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Restore Yarn cache
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Install dependencies
        run: yarn install --immutable
      - name: yarn ${{ matrix.script }}
        run: yarn ${{ matrix.script }}
